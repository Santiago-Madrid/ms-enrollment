
spring:
  application:
    name: ms-enrollment
  datasource:
    url: jdbc:mysql://localhost:3306/world_dance_enrollment
    username: root
    password: admin
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    consul:
      host: localhost # O la IP/host donde corre Consul
      port: 8500
      discovery:
        health-check-path: /actuator/health
        health-check-interval: 10s
        instance-id: ${spring.application.name}:${random.value}
        prefer-ip-address: true
  jpa:
    hibernate:
      ddl-auto: update 
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  main:
    allow-bean-definition-overriding: true
server:
  port: 9092
  servlet:
    context-path: /api/v1

security:
  jwt:
    secret-key: fx3VDiOxgojN6m3+9reMeoSdyPt7JOq0Zx67hKOIrHI= # 1 día en milisegundos
